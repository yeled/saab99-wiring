<text x="126" y="256.0" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Radiator fan: relay 38 is fed from fuse 7 on the always-live bar, and the thermostat switch earths its coil, so the drawing</text>
<text x="126" y="261.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">lets the fan run after the engine is switched off. 111 GN to the motor is dashed only because its full route isn’t traced.</text>
<text x="126" y="267.6" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Heater fan: fuse 6 is on the ignition-on bar. Position 8 feeds the motor directly; position 6 goes through resistor 74.</text>
<text x="126" y="273.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Heated rear window: fuse 8 (always live) feeds relay 113; switch 116 energises it through 213 BL. Its feed (214 BL) also powers the tachometer via 203.</text>
<text x="126" y="279.2" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Diagram is not RHD-specific: circuits should match, but harness routing and part positions may differ.</text>
