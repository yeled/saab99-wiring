<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Helvetica, Arial, sans-serif">
<rect width="420" height="297" fill="#fff"/><rect x="8" y="8" width="404" height="281" fill="none" stroke="#111" stroke-width=".6"/>
<text x="14" y="19" font-size="6" text-anchor="start" font-weight="bold" fill="#111">Saab 99 Turbo, model 1979 — Interior lights, seat heating, seat belt warning</text>
<text x="14" y="25.5" font-size="2.8" text-anchor="start" font-weight="normal" fill="#444">Redrawn from Saab Service Manual 1975–1980, diagram p. 371-28/29 (PDF p. 406–407). Component numbers as in the manual. Dashed = not traced yet.</text>
<text x="18" y="40" font-size="3.4" text-anchor="start" font-weight="bold" fill="#111">Seat heating</text>
<rect x="18" y="55" width="32" height="14" rx="1.2" fill="#fafafa" stroke="#111" stroke-width="0.8"/>
<text x="21" y="61" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">F5</tspan> · 8 A</text>
<text x="21" y="65.8" font-size="2.1" text-anchor="start" font-weight="normal" fill="#555">ignition-on bar</text>
