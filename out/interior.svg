<path d="M45,260 h7" stroke="#222" stroke-width="1.7"/><path d="M45,260 h7" stroke="#d42020" stroke-width="1.1"/>
<text x="54" y="261" font-size="2.5" text-anchor="start" font-weight="normal" fill="#111">RD Red</text>
<path d="M68,260 h7" stroke="#222" stroke-width="1.7"/><path d="M68,260 h7" stroke="#111111" stroke-width="1.1"/>
<text x="77" y="261" font-size="2.5" text-anchor="start" font-weight="normal" fill="#111">SV Black</text>
<path d="M91,260 h7" stroke="#222" stroke-width="1.7"/><path d="M91,260 h7" stroke="#ffffff" stroke-width="1.1"/>
<text x="100" y="261" font-size="2.5" text-anchor="start" font-weight="normal" fill="#111">VT White</text>
<path d="M22,267 h9" stroke="#222" stroke-width="1.2"/>
<text x="33" y="268" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">traced (cable no. read)</text>
<path d="M22,272.2 l0.9,1.0 l1.9,-2.4" fill="none" stroke="#1e7a3a" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"/>
<text x="26" y="274" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">checked on the car</text>
<text x="126" y="256.0" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Seat heating: fuse 5 (ignition-on bar) feeds 140 GL 1.0 through connector 58 at E12, which the manual draws as an optional pin,</text>
<text x="126" y="261.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">and connector 59 to the heating element; its return is 141 SV 1.0. This resolves one of fuse 5’s open wires.</text>
<text x="126" y="267.6" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Interior lights and seat belt warning are listed as references only: the checks on the car (docs/car-checklist.md) will fill them in.</text>
<text x="126" y="273.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Fuse 5 also powers the Turbo’s high-speed fuel boost (speed transmitter 140 and throttle switch 137): see the ignition sheet.</text>
<text x="126" y="279.2" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Diagram is not RHD-specific: circuits should match, but harness routing and part positions may differ.</text>
</svg>