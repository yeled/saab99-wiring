<text x="220" y="158.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">163 GL 0.75, 166 BL 0.75 to switch 56 (166 may be black: check R7)</text>
<text x="220" y="162.4" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">Combi Coupé: on the right-hand side of the luggage area, 10 W (check R7)</text>
<path d="M18,169 l6,-4 M24,167 h3" stroke="#111" stroke-width=".6"/>
<text x="30" y="168" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">56</tspan> Luggage compartment light switch</text>
<text x="30" y="172.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">166 BL 0.75 (may be black: check R7), earth</text>
<text x="30" y="176.4" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">Combi Coupé: a plunger at the tailgate striker, worked by the lock (check R7)</text>
<text x="18" y="188" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Dome light connector 57, 3-pole: pins carry 161 GL, 164 BL, and 167a SV (switch side) to 167 SV (lamp side). + is 160 GL from fuse 9.</text>
<text x="18" y="206" font-size="3.4" text-anchor="start" font-weight="bold" fill="#111">Seat belt warning</text>
<text x="18" y="212" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">Fuse 5’s 150 GL reaches the seat and belt contacts; through them, 156 BR and 151 BR feed lamp 72, which returns on 157 SV (probably).</text>
<text x="18" y="216.4" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">On the car (check I3): with the ignition on, the lamp stays lit until the driver buckles up; the passenger’s belt only counts while seat contact 69 is pressed.</text>
<path d="M18,223 l6,-4 M24,221 h3" stroke="#111" stroke-width=".6"/>
<text x="30" y="222" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">69</tspan> Seat contact</text>
<text x="30" y="226.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">passenger seat: closes when sat on (check I3); via seat belt contact connector 59</text>
<path d="M208,223 l6,-4 M214,221 h3" stroke="#111" stroke-width=".6"/>
<text x="220" y="222" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">70/71</tspan> Seat belt contacts L/R</text>
<text x="220" y="226.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">open when buckled (check I3); via seat belt contact connector 59; 168 SV 0.75 to earth</text>
