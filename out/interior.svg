<text x="254" y="69" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">141 SV 1.0</text>
<path d="M180,66 L180,86 L196,86" fill="none" stroke="#222" stroke-width="1.7" stroke-linejoin="round"/>
<path d="M180,66 L180,86 L196,86" fill="none" stroke="#f2c500" stroke-width="1.1" stroke-linejoin="round"/>
<rect x="198" y="83.4" width="81.41600000000001" height="5.2" rx="1" fill="#fff" stroke="#444" stroke-width=".4"/>
<text x="199.5" y="87" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">150 GL 0.75 via connector 60 → seat belt contacts (59, A8)</text>
<text x="18" y="108" font-size="3.4" text-anchor="start" font-weight="bold" fill="#111">Interior lights</text>
<text x="18" y="114" font-size="2.4" text-anchor="start" font-weight="normal" fill="#555">Fuse 9’s 160 GL feeds 52, then 161 GL through 57 to 50 and (163 GL) 55; 164 BL, 167 SV reach 50; 162/165 SV link 50–51; doors 170/171 SV.</text>
<circle cx="22" cy="125" r="3.2" fill="#fff" stroke="#111" stroke-width=".6"/>
<path d="M19.76,122.76 L24.24,127.24 M19.76,127.24 L24.24,122.76" stroke="#111" stroke-width=".45"/>
<text x="30" y="126" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">50</tspan> Dome light, door pillar (A10)</text>
<text x="30" y="130.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">164 BL 0.75, 167 SV 0.75</text>
<circle cx="212" cy="125" r="3.2" fill="#fff" stroke="#111" stroke-width=".6"/>
<path d="M209.76,122.76 L214.24,127.24 M209.76,127.24 L214.24,122.76" stroke="#111" stroke-width=".45"/>
<text x="220" y="126" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">51</tspan> Dome light, rear-view mirror (A10)</text>
<text x="220" y="130.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">162 SV 0.75, 165 SV 0.75</text>
<circle cx="22" cy="139" r="3.2" fill="#fff" stroke="#111" stroke-width=".6"/>
<path d="M19.76,136.76 L24.24,141.24 M19.76,141.24 L24.24,136.76" stroke="#111" stroke-width=".45"/>
<text x="30" y="140" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">52</tspan> Ignition switch light (A9)</text>
<text x="30" y="144.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">161 GL 0.75, 164 BL 0.75, via connector 57</text>
<path d="M208,141 l6,-4 M214,139 h3" stroke="#111" stroke-width=".6"/>
<text x="220" y="140" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">53</tspan> Interior lighting switch (A9)</text>
<text x="220" y="144.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">167a SV 0.75 via connector 60, 169 SV 0.75</text>
<path d="M18,155 l6,-4 M24,153 h3" stroke="#111" stroke-width=".6"/>
<text x="30" y="154" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">54</tspan> Door switch (A9, A11, B11)</text>
<text x="30" y="158.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">170 SV 0.75</text>
<circle cx="212" cy="153" r="3.2" fill="#fff" stroke="#111" stroke-width=".6"/>
<path d="M209.76,150.76 L214.24,155.24 M209.76,155.24 L214.24,150.76" stroke="#111" stroke-width=".45"/>
<text x="220" y="154" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">55</tspan> Luggage compartment light (A10)</text>
<text x="220" y="158.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">163 GL 0.75, 166 BL 0.75 to switch 56</text>
<path d="M18,169 l6,-4 M24,167 h3" stroke="#111" stroke-width=".6"/>
<text x="30" y="168" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">56</tspan> Luggage compartment light switch (A10)</text>
<text x="30" y="172.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">166 BL 0.75, earth</text>
<text x="18" y="188" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">57 3-pole connector (A10): pins carry 161 GL, 164 BL, and 167a SV (switch side) to 167 SV (lamp side). + is 160 GL from fuse 9.</text>
<text x="18" y="206" font-size="3.4" text-anchor="start" font-weight="bold" fill="#111">Seat belt warning</text>
<text x="18" y="212" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">Fuse 5’s 150 GL reaches the seat and belt contacts; through them, 156 BR and 151 BR feed lamp 72, which returns on 157 SV (probably).</text>
<path d="M18,223 l6,-4 M24,221 h3" stroke="#111" stroke-width=".6"/>
<text x="30" y="222" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">69</tspan> Seat contact (A8)</text>
<text x="30" y="226.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">via 59 (A8); contact wiring too cramped to read</text>
<path d="M208,223 l6,-4 M214,221 h3" stroke="#111" stroke-width=".6"/>
<text x="220" y="222" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">70/71</tspan> Seat belt contacts L/R (A8)</text>
<text x="220" y="226.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">via 59 (A8); 168 SV 0.75 to earth</text>
<circle cx="22" cy="233" r="3.2" fill="#fff" stroke="#111" stroke-width=".6"/>
<path d="M19.76,230.76 L24.24,235.24 M19.76,235.24 L24.24,230.76" stroke="#111" stroke-width=".45"/>
<text x="30" y="234" font-size="2.7" text-anchor="start" font-weight="normal" fill="#111"><tspan font-weight="bold">72</tspan> Seat belt warning lamp (D12)</text>
<text x="30" y="238.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#555">151 BR 0.75 in, 157 SV 0.75 to earth, via 59 (C12)</text>
