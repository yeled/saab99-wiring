<text x="126" y="256.0" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Speaker polarity: 342 and 344 to +, 343 and 345 to −. Junction box 122’s pins are drawn in their physical order.</text>
<text x="126" y="261.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">The radio’s + (340 RD) comes from ignition switch X, so it’s live only with the key on (check D1: dead with the key out).</text>
<text x="126" y="266.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Left and right as on this car (check I1): right-hand speaker 344/345, left-hand 342/343.</text>
<text x="126" y="272.2" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Fuse 9 (lid: cigar lighter, compartment light, clock): 126 BL enters tail lamp connector 58 and leaves the same pin as 160 GL to the interior lights.</text>
<text x="126" y="277.6" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">126a BL to the lighter probably joins that pin on the fuse side, so the link is drawn grey. The clock’s 127 BL takes off 126a.</text>
<text x="126" y="283.0" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Where junction box 122 sits on this RHD car is not known yet (check D6); on LHD cars it is in the right-hand trim panel under the dash.</text>
</svg>