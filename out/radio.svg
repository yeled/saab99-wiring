<text x="33" y="268" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">traced (cable no. read)</text>
<text x="126" y="256.0" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Pin numbers and speaker polarity (342, 344 to +; 343, 345 to −) are from the radio installation page, PDF p. 798.</text>
<text x="126" y="261.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">The radio’s + (340 RD) comes from ignition switch X here, so it’s live with the key on; the radio page describes a battery feed.</text>
<text x="126" y="267.6" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Left and right: the 1979 Turbo diagram puts 344/345 on the left speaker and 342/343 on the right; the radio page swaps them.</text>
<text x="126" y="273.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Fuse 9 (lid: cigar lighter, compartment light, clock) feeds the lighter on 126a BL; the clock’s 127 BL takes off the same line.</text>
<text x="126" y="279.2" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">The radio page puts the junction box in the right-hand trim panel under the dash; that’s for LHD cars.</text>
