<text x="126" y="256.0" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Inside 47 as printed (its own terminal numbers): a + rail from 2 (182) feeds both gauges and the oil (11), low-fuel (12), brake (5) and charge (1) lamps; an earth rail to 4 (179) takes the gauges’ third leads and the main-beam (7) and indicator (6) lamps.</text>
<text x="126" y="261.2" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Oil and temperature wires pass connector 58 (A4), pins 5 and 6; the fuel sender wires pass 3-pole connector 57 (B12).</text>
<text x="126" y="266.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Charge lamp: alternator D+ is 195 RD 0.75. Main-beam lamp: 27 BL/VT from lighting relay 8. Indicator lamp: 71 GN/VT from flasher 23.</text>
<text x="126" y="271.6" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Supply: 182 BR/VT from fuse 4, branching off the wiper feed 85 BR at connector 58 (D8). Tachometer: signal 204 GL, supply 203 via 116.</text>
<text x="126" y="276.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">44 and 45 are drawn with the manual’s sender symbol (heavy square with a diagonal, not a winding), each with its own earth lead (no number printed). 44 probably earths the oil lamp at low oil pressure; 45 is probably a resistance that falls as the coolant warms.</text>
<text x="126" y="282.0" font-size="2.35" text-anchor="start" font-weight="normal" fill="#333">Diagram is not RHD-specific: circuits should match, but harness routing and part positions may differ.</text>
</svg>